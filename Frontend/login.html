<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabita College Portal - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <span class="college-name">Rabita College</span>
        </div>
    </header>
    <main class="main-container">
        <div class="login-card">
            <div class="card-header">
                <h1>Rabita College Portal</h1>
                <p>Fill in your credentials to access your account</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="username">Username / Student ID</label>
                    <input type="text" id="username" name="username" placeholder="Student ID / Roll No" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Login</button>

            </form>
        </div>
    </main>
<footer class="footer">
    <p>© 2026 Rabita College Portal</p>
</footer>
<script src="js/common.js"></script>
</body>
</html>
